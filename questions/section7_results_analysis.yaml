- id: S7-004
  section: 7
  question: "Given the code below, how would you retrieve probability distribution from sampler results? Assume all components have been imported correctly."
  code: |
    qbits = QuantumRegister(2,"qbits")
    clbits = ClassicalRegister(2,"clbits")
    qc = QuantumCircuit(qbits, clbits)
    (q0, q1) = qbits
    (c0, c1) = clbits
    qc.h(0)
    qc.cx(0,1)
    qc.measure(qbits,clbits)
    service = QiskitRuntimeService()
    backend = service.least_busy()
    pm = generate_preset_pass_manager(backend=backend,optimization_level=2)
    qc_isa = pm.run(qc)
    sampler = SamplerV2(mode=backend)
    job =sampler.run([qc_isa])
    result = job.result()
  choices:
    A: "counts = result[0].data.meas.get\\_counts()"
    B: "counts = result[0].data.clbits.get\\_counts()"
    C: "counts = result[0].data.evs.get\\_counts()"
    D: "counts = result[0].data.stds.get\\_counts()"
  answer: B

- id: S7-005
  section: 7
  question: "Given the code below, how would you retrieve probability distribution from sampler results? Assume all components have been imported correctly."
  code: |
    qbits = QuantumRegister(2,"qbits")
    clbits = ClassicalRegister(2,"clbits")
    qc = QuantumCircuit(qbits, clbits)
    (q0, q1) = qbits
    (c0, c1) = clbits
    qc.h(0)
    qc.cx(0,1)
    qc.measure_all()
    service = QiskitRuntimeService()
    backend = service.least_busy()
    pm = generate_preset_pass_manager(backend=backend,optimization_level=2)
    qc_isa = pm.run(qc)
    sampler = SamplerV2(mode=backend)
    job =sampler.run([qc_isa])
    result = job.result()
  choices:
    A: "counts = result[0].data.meas.get\\_counts()"
    B: "counts = result[0].data.clbits.get\\_counts()"
    C: "counts = result[0].data.evs.get\\_counts()"
    D: "counts = result[0].data.stds.get\\_counts()"
  answer: A

