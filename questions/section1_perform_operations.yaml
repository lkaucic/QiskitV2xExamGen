- id: S1-007
  section: 1
  question: "Given the following code fragment, what is the approximate probability that a measurement would result in a bit value of 1?"
  code: |
    from qiskit import QuantumCircuit
    from numpy import pi
    qc = QuantumCircuit(1)
    qc.reset(0)
    qc.sx(0)
    qc.rx(pi/2,0)
    qc.measure_all()
  choices:
    A: "0.75"
    B: "0.0"
    C: "0.5"
    D: "1.0"
  answer: D

