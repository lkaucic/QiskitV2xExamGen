- id: S5-001
  section: 5
  question: "What does the Sampler primitive primarily return?"
  choices:
    A: "Expectation values"
    B: "Measurement samples or bitstring results"
    C: "Only statevectors"
    D: "Only transpiled circuits"
  answer: B

- id: S5-002
  section: 5
  question: "When is Sampler more appropriate than Estimator?"
  choices:
    A: "When you need bitstring measurement outcomes"
    B: "When you need expectation values of observables"
    C: "When you need to draw a circuit"
    D: "When you need to create a backend"
  answer: A

- id: S5-003
  section: 5
  question: "Which of these options is unique to Sampler?"
  choices:
    A: "default\\_shots"
    B: "default\\_precision"
    C: "shots\\_per\\_randomization"
    D: "none of the above"
  answer: D

- id: S5-004
  section: 5
  question: "What happens if you run Sampler on a circuit without measurements?"
  choices:
    A: "Code won't run and error will be returner"
    B: "Sampler will add measurements by itself and run the job"
    C: "Job will run and result will be empty"
    D: "none of the above"
  answer: C

  

